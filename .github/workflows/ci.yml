name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  deploy-check:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Deploy
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "Error: APP_TOKEN secret is missing."
            exit 1
          fi

          echo "Deployment token is configured successfully."
